name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4

      - name: Install pre-commit
        run: uv pip install --system pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Check version increment
        if: github.event_name == 'pull_request'
        run: |
          CURRENT_VERSION=$(cat version)
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:version)
          python3 << EOF
          def parse_version(v):
              return tuple(int(x) for x in v.strip().split('.'))
          
          current = parse_version("$CURRENT_VERSION")
          base = parse_version("$BASE_VERSION")
          
          if current <= base:
              print("❌ Version has not been incremented. Please update the version file.")
              print(f"  Base version: $BASE_VERSION")
              print(f"  Current version: $CURRENT_VERSION")
              exit(1)
          print(f"✓ Version incremented: $BASE_VERSION -> $CURRENT_VERSION")
          EOF

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            dev-requirements.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r dev-requirements.txt

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
