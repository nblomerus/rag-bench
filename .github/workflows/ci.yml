name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BADGE_GIST_ID: 0ccf5c2eaa0512f4cc204b5cadb446c7

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4

      - name: Install pre-commit
        run: uv pip install --system pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Check version increment
        if: github.event_name == 'pull_request'
        run: |
          CURRENT_VERSION=$(cat version)
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:version)
          python3 << EOF
          def parse_version(v):
              return tuple(int(x) for x in v.strip().split('.'))
          
          current = parse_version("$CURRENT_VERSION")
          base = parse_version("$BASE_VERSION")
          
          if current <= base:
              print("❌ Version has not been incremented. Please update the version file.")
              print(f"  Base version: $BASE_VERSION")
              print(f"  Current version: $CURRENT_VERSION")
              exit(1)
          print(f"✓ Version incremented: $BASE_VERSION -> $CURRENT_VERSION")
          EOF

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            dev-requirements.txt

      - name: Install CPU-only PyTorch
        run: uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          # Strip CUDA/GPU packages that are pulled in by the CUDA torch build
          # but are not needed for CPU-only CI (saves ~1.5 GB of downloads)
          grep -vE "^(nvidia-|cuda-|triton)" requirements.txt > /tmp/requirements-nocuda.txt
          uv pip install --system -r /tmp/requirements-nocuda.txt -r dev-requirements.txt

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  badges:
    name: Update Badges
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Extract coverage percentage
        id: coverage
        run: |
          COV=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          rate = float(tree.getroot().attrib['line-rate'])
          print(int(rate * 100))
          ")
          echo "pct=$COV" >> "$GITHUB_OUTPUT"
          if [ "$COV" -ge 90 ]; then echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          elif [ "$COV" -ge 75 ]; then echo "color=green" >> "$GITHUB_OUTPUT"
          elif [ "$COV" -ge 60 ]; then echo "color=yellow" >> "$GITHUB_OUTPUT"
          else echo "color=red" >> "$GITHUB_OUTPUT"; fi

      - name: Read version
        id: version
        run: echo "ver=$(cat version)" >> "$GITHUB_OUTPUT"

      - name: Read Python version
        id: python
        run: echo "ver=$(grep 'PYTHON_VERSION' Makefile | head -1 | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ env.BADGE_GIST_ID }}
          filename: coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.pct }}%
          color: ${{ steps.coverage.outputs.color }}

      - name: Update version badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ env.BADGE_GIST_ID }}
          filename: version.json
          label: version
          message: ${{ steps.version.outputs.ver }}
          color: blue

      - name: Update Python badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ env.BADGE_GIST_ID }}
          filename: python.json
          label: python
          message: ${{ steps.python.outputs.ver }}
          color: blue
