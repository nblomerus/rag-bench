<body class="bg-gray-950 text-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        const API_BASE = '/api';

        // ─── API helpers ──────────────────────────────────────────

        // Stream tokens from SSE endpoint, calling callbacks as events arrive
        async function queryRAGStream(question, { onSources, onToken, onDone, onError, topK = 5 }) {
            const res = await fetch(`${API_BASE}/query/stream`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, top_k: topK }),
            });
            if (!res.ok) throw new Error(`API error: ${res.status}`);

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop(); // keep incomplete line in buffer

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    try {
                        const evt = JSON.parse(line.slice(6));
                        if (evt.event === 'sources' && onSources) onSources(evt.sources || []);
                        else if (evt.event === 'token' && onToken) onToken(evt.token);
                        else if (evt.event === 'done' && onDone) onDone(evt);
                        else if (evt.event === 'error' && onError) onError(evt.message);
                    } catch (e) { /* skip malformed */ }
                }
            }
        }

        // Non-streaming fallback (used by eval)
        async function queryRAG(question, topK = 5) {
            const res = await fetch(`${API_BASE}/query`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, top_k: topK }),
            });
            if (!res.ok) throw new Error(`API error: ${res.status}`);
            return res.json();
        }

        async function fetchStats() {
            const res = await fetch(`${API_BASE}/stats`);
            if (!res.ok) throw new Error(`Stats error: ${res.status}`);
            return res.json();
        }

        async function runEvalAPI(runAll = false) {
            const res = await fetch(`${API_BASE}/eval`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ run_all: runAll }),
            });
            if (!res.ok) throw new Error(`Eval error: ${res.status}`);
            return res.json();
        }

        async function fetchPaper(paperId) {
            const res = await fetch(`${API_BASE}/papers/${encodeURIComponent(paperId)}`);
            if (!res.ok) throw new Error(`Paper fetch error: ${res.status}`);
            return res.json();
        }

        // ─── Icons (inline SVGs) ─────────────────────────────────
        const Icon = ({ d, size = 16, className = '' }) => (

        const ChevronUp = ({ size }) => <Icon size={size} d="M18 15L12 9L6 15" />;
        const XIcon = ({ size }) => <Icon size={size} d="M18 6L6 18M6 6L18 18" />;
        const EyeIcon = ({ size }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" />
            </svg>
        );
        const ArrowLeftIcon = ({ size }) => <Icon size={size} d="M19 12H5M12 19L5 12L12 5" />;
        const AlertIcon = ({ size }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
        );
        const Spinner = ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
                strokeWidth="2" className="animate-spin">
                <path d="M21 12a9 9 0 11-6.219-8.56" />
            </svg>
        );

        // ─── Render math with KaTeX (safe fallback) ───────────────
        function renderKatex(latex, displayMode) {
            try {
                return katex.renderToString(latex, { displayMode, throwOnError: false, trust: true });
            } catch (e) {
                // Return the raw LaTeX in a styled span so it's still readable
                return `<code class="text-yellow-300">${latex}</code>`;
            }
        }

        // ─── Format answer: Markdown + KaTeX + Citation refs ─────
        function formatAnswer(text) {
            if (!text) return null;

            // Step 1: Protect [Source N] citations from markdown mangling
            let processed = text.replace(/\[Source (\d+)\]/g, '%%SOURCE_$1%%');

            // Step 2: Protect and render KaTeX math BEFORE markdown processing
            // This prevents marked from mangling LaTeX backslashes and underscores.
            const mathBlocks = [];
            let mathIdx = 0;

            // Display math: $$ ... $$
            processed = processed.replace(/\$\$([\s\S]*?)\$\$/g, (_, latex) => {
                const rendered = renderKatex(latex.trim(), true);
                const placeholder = `%%MATH_BLOCK_${mathIdx}%%`;
                mathBlocks.push(rendered);
                mathIdx++;
                return placeholder;
            });

            // Inline math: $ ... $ (but not $$)
            processed = processed.replace(/(?<!\$)\$(?!\$)((?:[^$\\]|\\.)+?)\$(?!\$)/g, (_, latex) => {
                const rendered = renderKatex(latex.trim(), false);
                const placeholder = `%%MATH_BLOCK_${mathIdx}%%`;
                mathBlocks.push(rendered);
                mathIdx++;
                return placeholder;
            });

            // Step 3: Render markdown via marked
            if (window.marked) {
                marked.setOptions({
                    breaks: true,
                    gfm: true,
                    headerIds: false,
                    mangle: false,
                });
                processed = marked.parse(processed);
            }

            // Step 4: Restore math blocks (they were protected from markdown)
            for (let i = 0; i < mathBlocks.length; i++) {
                processed = processed.replace(`%%MATH_BLOCK_${i}%%`, mathBlocks[i]);
            }

            // Step 5: Restore citation refs with clickable spans
            processed = processed.replace(/%%SOURCE_(\d+)%%/g,
                '<span class="citation-ref" data-source-idx="$1" role="button" tabindex="0">[Source $1]</span>');

            return <div className="answer-md" dangerouslySetInnerHTML={{ __html: processed }} />;
        }

        // ─── Source Card ──────────────────────────────────────────
        function SourceCard({ source, index, isExpanded, onToggle, onViewInPaper }) {
            const relevance = source.relevance || 'low';
            const badgeConfig = {
                high: { color: 'text-green-400', bg: 'bg-green-400/10', border: 'border-green-800/50', label: 'High match' },
                medium: { color: 'text-yellow-400', bg: 'bg-yellow-400/10', border: 'border-yellow-800/50', label: 'Partial match' },
                low: { color: 'text-orange-400', bg: 'bg-orange-400/10', border: 'border-orange-800/50', label: 'Weak match' },
            };
            const badge = badgeConfig[relevance] || badgeConfig.low;

            return (
                <div className={`source-card bg-gray-800 rounded-lg border ${badge.border} p-3`}>
                    <div className="flex items-start justify-between cursor-pointer" onClick={onToggle}>
                        <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-2">
                                <span className="text-xs font-bold text-blue-400 bg-blue-400/10 px-2 py-0.5 rounded">
                                    Source {index + 1}
                                </span>
                                <span className={`text-xs font-mono font-semibold ${badge.color}`}>
                                    {source.score.toFixed(2)}
                                </span>
                                <span className={`text-[10px] px-1.5 py-0.5 rounded ${badge.bg} ${badge.color}`}>
                                    {badge.label}
                                </span>
                            </div>
                            <p className="text-sm text-gray-200 mt-1 truncate font-medium">{source.title}</p>
                            {source.section && <p className="text-xs text-gray-500 mt-0.5">{source.section}</p>}
                        </div>
                        <div className="flex items-center gap-1 ml-2 flex-shrink-0">
                            {source.paper_id && (
                                <button
                                    onClick={(e) => { e.stopPropagation(); onViewInPaper && onViewInPaper(source); }}
                                    className="text-blue-400 hover:text-blue-300 p-1 rounded hover:bg-blue-400/10 transition"
                                    title="View in paper">
                                    <EyeIcon size={14} />
                                </button>
                            )}
                            <button className="text-gray-500 hover:text-gray-300">
                                {isExpanded ? <ChevronUp size={16} /> : <ChevronDown size={16} />}
                            </button>
                        </div>
                    </div>
                    {isExpanded && (
                        <div className="mt-2 pt-2 border-t border-gray-700">
                            <p className="text-xs text-gray-400 leading-relaxed whitespace-pre-wrap">
                                {source.text_preview}
                            </p>
                            {source.paper_id && (
                                <button
                                    onClick={() => onViewInPaper && onViewInPaper(source)}
                                    className="mt-2 text-xs text-blue-400 hover:text-blue-300 flex items-center gap-1">
                                    <EyeIcon size={12} /> View passage in full paper
                                </button>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // ─── Message Bubble ──────────────────────────────────────
        function Message({ message, onViewSource }) {
            const [expandedSources, setExpandedSources] = useState({});
            const toggleSource = (idx) => setExpandedSources(p => ({ ...p, [idx]: !p[idx] }));
            const answerRef = useRef(null);

            // Handle clicks on [Source N] citation refs inside the rendered answer
            useEffect(() => {
                const el = answerRef.current;
                if (!el || !onViewSource || !message.data?.sources?.length) return;
                const handler = (e) => {
                    const citEl = e.target.closest('[data-source-idx]');
                    if (!citEl) return;
                    const idx = parseInt(citEl.dataset.sourceIdx, 10) - 1; // Source 1 → index 0
                    const source = message.data.sources[idx];
                    if (source) onViewSource(source);
                };
                el.addEventListener('click', handler);
                return () => el.removeEventListener('click', handler);
            }, [message.data?.sources, onViewSource]);

            if (message.role === 'user') {
                return (
                    <div className="flex justify-end mb-4">
                        <div className="bg-blue-600 text-white px-4 py-3 rounded-2xl rounded-br-md max-w-[75%]">
                            <p className="text-sm whitespace-pre-wrap">{message.content}</p>
                        </div>
                    </div>

            }

            const { data, streaming } = message;
            // Split answer before "Sources:" section
            const answerText = (message.content || '').split('\nSources:\n')[0];

            return (
                <div className="flex justify-start mb-6">
                    <div className="max-w-[85%] w-full">
                        {data?.deflected && !streaming && (
                            <div className="flex items-center gap-2 bg-amber-900/30 border border-amber-700/50 text-amber-300 px-3 py-2 rounded-lg mb-2 text-xs">
                                <AlertIcon size={14} />
                                <span>Deflected: {data.deflection_reason}</span>
                            </div>

                        <div className="bg-gray-800 border border-gray-700 rounded-2xl rounded-bl-md px-4 py-3">
                            <div ref={answerRef} className="text-sm text-gray-200 leading-relaxed">
                                {answerText ? formatAnswer(answerText) : (streaming ? '' : 'No response.')}
                                {streaming && <span className="inline-block w-2 h-4 bg-blue-400 ml-0.5 animate-pulse rounded-sm" />}
                            </div>
                            {data && !streaming && (
                                <div className="flex items-center gap-3 mt-3 pt-2 border-t border-gray-700 text-xs text-gray-500">
                                    <span className="flex items-center gap-1"><ZapIcon size={12} />{data.latency_ms?.toFixed(0) || '0'}ms</span>
                                    <span className="flex items-center gap-1"><CpuIcon size={12} />{data.backend || '...'}/{((data.model || '').split(':')[0]) || '...'}</span>
                                    <span className="flex items-center gap-1"><SearchIcon size={12} />{data.sources?.length || 0} relevant source{data.sources?.length !== 1 ? 's' : ''}</span>
                                </div>
                            )}
                            {streaming && data?.sources?.length > 0 && (
                                <div className="flex items-center gap-2 mt-2 pt-2 border-t border-gray-700 text-xs text-gray-500">
                                    <SearchIcon size={12} />
                                    <span>{data.sources.length} source{data.sources.length !== 1 ? 's' : ''} found — generating answer...</span>
                                </div>
                            )}
                        </div>
                        {data?.sources?.length > 0 && !data.deflected && (
                            <div className="mt-2 space-y-1.5">
                                {data.sources.map((source, idx) => (
                                    <SourceCard key={idx} source={source} index={idx}
                                        isExpanded={expandedSources[idx] || false}
                                        onToggle={() => toggleSource(idx)}
                                        onViewInPaper={onViewSource} />
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ─── Loading Dots ────────────────────────────────────────
        function LoadingDots() {

        function EvalPanel({ evalResults, isRunning, onRun, onClose }) {

        // ─── Paper Viewer (persistent right panel) — PDF.js viewer + cited passage ─
        function PaperViewer({ paper, highlightChunkId, highlightText, onClose, isEmpty }) {
            const [pdfError, setPdfError] = useState(false);
            const [pdfDoc, setPdfDoc] = useState(null);
            const [currentPage, setCurrentPage] = useState(1);
            const [totalPages, setTotalPages] = useState(0);
            const [isSearching, setIsSearching] = useState(false);
            const [searchStatus, setSearchStatus] = useState('');
            const [highlightBoxes, setHighlightBoxes] = useState([]);
            const [renderScale, setRenderScale] = useState(1.5);
            const canvasRef = useRef(null);
            const containerRef = useRef(null);

            // Close on Escape key
            useEffect(() => {
                const handler = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [onClose]);

            // Find the cited chunk for the floating reference card
            let citedChunk = null;
            if (paper && highlightChunkId) {
                citedChunk = paper.chunks.find(c => c.chunk_id === highlightChunkId);
            }
            if (!citedChunk && paper && highlightText) {
                const preview = highlightText.slice(0, 100).toLowerCase();
                citedChunk = paper.chunks.find(c => c.text && c.text.toLowerCase().includes(preview));
            }

            const hasPdf = paper && !!paper.arxiv_id;
            const pdfUrl = hasPdf ? `${API_BASE}/papers/${encodeURIComponent(paper.paper_id || paper.arxiv_id)}/pdf` : '';

            // Load PDF document
            useEffect(() => {
                if (!pdfUrl) return;

                let cancelled = false;

                async function loadPDF() {
                    try {
                        // Use global pdfjsLib from CDN
                        if (!window.pdfjsLib) {
                            console.error('PDF.js library not loaded');
                            setPdfError(true);
                            return;
                        }

                        // Set worker path
                        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
                            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

                        const loadingTask = window.pdfjsLib.getDocument(pdfUrl);
                        const pdf = await loadingTask.promise;

                        if (cancelled) return;
                        setPdfDoc(pdf);
                        setTotalPages(pdf.numPages);
                        setPdfError(false);
                    } catch (error) {
                        console.error('Error loading PDF:', error);
                        if (!cancelled) setPdfError(true);
                    }
                }

                loadPDF();
                return () => { cancelled = true; };
            }, [pdfUrl]);

            // Render current page
            useEffect(() => {
                if (!pdfDoc || !canvasRef.current || currentPage < 1 || currentPage > totalPages) return;

                let cancelled = false;

                async function renderPage() {
                    try {
                        const page = await pdfDoc.getPage(currentPage);
                        if (cancelled) return;

                        const canvas = canvasRef.current;
                        const context = canvas.getContext('2d');

                        // Use fixed scale for consistent rendering
                        const RENDER_SCALE = 1.5;
                        const viewport = page.getViewport({ scale: RENDER_SCALE });

                        canvas.width = viewport.width;
                        canvas.height = viewport.height;

                        const renderContext = {
                            canvasContext: context,
                            viewport: viewport
                        };

                        await page.render(renderContext).promise;
                        setRenderScale(RENDER_SCALE);
                    } catch (error) {
                        console.error('Error rendering page:', error);
                    }
                }

                renderPage();
                return () => { cancelled = true; };
            }, [pdfDoc, currentPage, totalPages]);

            // Search for cited text and navigate to it
            useEffect(() => {
                if (!pdfDoc || !citedChunk || !citedChunk.text) return;

                let cancelled = false;

                async function searchAndHighlight() {
                    setIsSearching(true);
                    setSearchStatus('Searching...');
                    setHighlightBoxes([]);

                    try {
                        // Strip contextual prefix added during chunking: "Title — Section\n\n"
                        let chunkText = citedChunk.text.trim();
                        const prefixMatch = chunkText.match(/^.+ — .+\n\n/);
                        if (prefixMatch) {
                            chunkText = chunkText.slice(prefixMatch[0].length).trim();
                        }

                        const firstWords = chunkText.split(/\s+/).slice(0, 8).join(' ').toLowerCase();
                        const searchWords = chunkText.slice(0, 150).toLowerCase()
                            .split(/\s+/).filter(w => w.length > 2);

                        // Helper: strict prefix match — only matches the first 8 words as a contiguous sequence
                        function findPassageStart(items) {
                            for (let i = 0; i < items.length; i++) {
                                let concat = '';
                                for (let j = i; j < Math.min(i + 15, items.length); j++) {
                                    concat += (j > i ? ' ' : '') + items[j].str.trim();
                                    const concatLower = concat.toLowerCase();
                                    if (concatLower.length >= firstWords.length && concatLower.startsWith(firstWords)) {
                                        return items[i];
                                    }
                                }
                            }
                            return null;
                        }

                        // Helper: create a highlight box from a text item
                        function makeHighlight(item, page) {
                            const RENDER_SCALE = 1.5;
                            const viewport = page.getViewport({ scale: RENDER_SCALE });
                            const x0 = item.transform[4];
                            const y0 = item.transform[5];
                            const w = item.width * RENDER_SCALE;
                            const h = (item.height || item.transform[3]) * RENDER_SCALE;
                            const x = x0 * RENDER_SCALE;
                            const canvasY = viewport.height - (y0 * RENDER_SCALE);
                            return {
                                leftPct: Math.max(0, (x / viewport.width) * 100),
                                topPct: Math.max(0, ((canvasY - h) / viewport.height) * 100),
                                widthPct: Math.max(0.5, (w / viewport.width) * 100),
                                heightPct: Math.max(0.5, (h / viewport.height) * 100),
                                isFirst: true
                            };
                        }

                        // Pass 1: strict prefix match — scan all pages for the exact passage start
                        let found = false;
                        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                            if (cancelled) return;
                            const page = await pdfDoc.getPage(pageNum);
                            const textContent = await page.getTextContent();
                            const items = textContent.items.filter(it => it.str && it.str.trim());

                            const foundItem = findPassageStart(items);
                            if (foundItem && !cancelled) {
                                setCurrentPage(pageNum);
                                setHighlightBoxes([makeHighlight(foundItem, page)]);
                                setSearchStatus(`Found on page ${pageNum}`);
                                found = true;
                                break;
                            }
                        }

                        // Pass 2: if strict match failed, try looser 3-word phrase match
                        if (!found && !cancelled) {
                            const phrase = chunkText.split(/\s+/).slice(0, 3).join(' ').toLowerCase();
                            for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                                if (cancelled) return;
                                const page = await pdfDoc.getPage(pageNum);
                                const textContent = await page.getTextContent();
                                const items = textContent.items.filter(it => it.str && it.str.trim());
                                const pageText = items.map(it => it.str).join(' ').toLowerCase();

                                // Only consider pages with enough word overlap
                                const matchCount = searchWords.filter(word => pageText.includes(word)).length;
                                const requiredMatches = Math.max(2, Math.ceil(searchWords.length * 0.4));
                                if (matchCount < requiredMatches) continue;

                                // Look for the 3-word phrase in concatenated page text
                                if (pageText.includes(phrase)) {
                                    const phraseItem = items.find(it => it.str.toLowerCase().includes(phrase));
                                    if (phraseItem && !cancelled) {
                                        setCurrentPage(pageNum);
                                        setHighlightBoxes([makeHighlight(phraseItem, page)]);
                                        setSearchStatus(`Found on page ${pageNum}`);
                                        found = true;
                                        break;
                                    }
                                }
                            }
                        }

                        // Pass 3: last resort — just navigate to the page with most word overlap
                        if (!found && !cancelled) {
                            let bestPage = 1;
                            let bestCount = 0;
                            for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                                if (cancelled) return;
                                const page = await pdfDoc.getPage(pageNum);
                                const textContent = await page.getTextContent();
                                const pageText = textContent.items.map(it => it.str).join(' ').toLowerCase();
                                const matchCount = searchWords.filter(word => pageText.includes(word)).length;
                                if (matchCount > bestCount) {
                                    bestCount = matchCount;
                                    bestPage = pageNum;
                                }
                            }
                            setCurrentPage(bestPage);
                            setSearchStatus(`Navigated to page ${bestPage}`);
                        }

                        if (!cancelled) {
                            setIsSearching(false);
                            setTimeout(() => setSearchStatus(''), 4000);
                        }
                    } catch (error) {
                        console.error('Error searching PDF:', error);
                        if (!cancelled) {
                            setIsSearching(false);
                            setSearchStatus('');
                        }
                    }
                }

                searchAndHighlight();
                return () => { cancelled = true; };
            }, [pdfDoc, citedChunk]);

            // Page navigation handlers
            const goToPrevPage = () => {
                if (currentPage > 1) {
                    setCurrentPage(currentPage - 1);
                    setHighlightBoxes([]);
                }
            };

            const goToNextPage = () => {
                if (currentPage < totalPages) {
                    setCurrentPage(currentPage + 1);
                    setHighlightBoxes([]);
                }
            };

            return (
                <div className={`paper-panel ${isEmpty ? 'empty' : 'visible'}`}>
                    {/* Header bar */}
                    <div className="paper-viewer-header">
                        <div className="flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2 min-w-0">
                                {!isEmpty && (
                                    <button onClick={onClose}
                                        className="text-gray-400 hover:text-gray-200 p-1 rounded hover:bg-gray-700 flex-shrink-0"
                                        title="Close">
                                        <XIcon size={16} />
                                    </button>
                                )}
                                <span className="text-xs text-gray-300 truncate font-medium">
                                    {isEmpty ? 'Reference Viewer' : paper.title}
                                </span>
                            </div>
                            {!isEmpty && (
                                <div className="flex items-center gap-2 flex-shrink-0">
                                    {paper.year > 0 && (
                                        <span className="text-[10px] text-gray-500">{paper.year}</span>
                                    )}
                                    {paper.arxiv_id && (
                                        <a href={`https://arxiv.org/abs/${paper.arxiv_id}`}
                                            target="_blank" rel="noopener noreferrer"
                                            className="text-[10px] text-blue-400 hover:text-blue-300">
                                            arXiv:{paper.arxiv_id}
                                        </a>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Content area */}
                    {isEmpty ? (
                        <div className="flex-1 flex flex-col items-center justify-center text-gray-500 text-center p-8">
                            <div className="w-16 h-16 bg-gray-800/30 rounded-full flex items-center justify-center mb-4">
                                <EyeIcon size={32} />
                            </div>
                            <h3 className="text-sm font-medium text-gray-400 mb-2">No reference selected</h3>
                            <p className="text-xs text-gray-600 max-w-xs">
                                Click the eye icon next to any source to view the full paper with highlighted citations.
                            </p>
                        </div>
                    ) : hasPdf && !pdfError && pdfDoc ? (
                        <div className="paper-pdf-container" ref={containerRef}>
                            {/* PDF Controls */}
                            <div className="pdf-controls">
                                <button onClick={goToPrevPage} disabled={currentPage <= 1 || isSearching}>
                                    ← Previous
                                </button>
                                <span className="pdf-status">
                                    Page {currentPage} of {totalPages}
                                    {isSearching && (
                                        <span className="loading-dots">
                                            <span></span><span></span><span></span>
                                        </span>
                                    )}
                                </span>
                                <button onClick={goToNextPage} disabled={currentPage >= totalPages || isSearching}>
                                    Next →
                                </button>
                                {searchStatus && (
                                    <span className="text-xs text-amber-400 ml-2">{searchStatus}</span>
                                )}
                            </div>

                            {/* PDF Content Area */}
                            <div className="paper-pdf-content">
                                <div className="pdf-canvas-wrapper">
                                    <canvas ref={canvasRef} className="pdf-canvas" />
                                    {/* Highlight overlays */}
                                    {highlightBoxes.map((box, idx) => (
                                        <div
                                            key={idx}
                                            className={`pdf-text-highlight ${box.isFirst ? 'first-highlight' : ''}`}
                                            style={{
                                                left: `${box.leftPct}%`,
                                                top: `${box.topPct}%`,
                                                width: `${box.widthPct}%`,
                                                height: `${box.heightPct}%`
                                            }}
                                        />
                                    ))}
                                </div>
                            </div>

                            {/* Referenced passage below PDF */}
                            {citedChunk && (() => {
                                // Strip contextual prefix for cleaner display
                                let displayText = citedChunk.text.trim();
                                const prefixMatch = displayText.match(/^.+ — .+\n\n/);
                                if (prefixMatch) {
                                    displayText = displayText.slice(prefixMatch[0].length).trim();
                                }
                                return (
                                    <div className="cited-passage-card">
                                        <div className="cited-passage-header">
                                            <div className="flex items-center gap-2">
                                                <span className="text-[10px] font-semibold text-amber-400">
                                                    Referenced passage
                                                </span>
                                                {citedChunk.section && (
                                                    <span className="cited-passage-section">
                                                        {citedChunk.section.replace(/_/g, ' ')}
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                        <div className="cited-passage-body">
                                            {displayText}
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>
                    ) : hasPdf && !pdfError && !pdfDoc ? (
                        <div className="flex-1 flex items-center justify-center text-gray-500 text-sm">
                            <div className="loading-dots">
                                <span></span><span></span><span></span>
                            </div>
                            <span className="ml-2">Loading PDF...</span>
                        </div>
                    ) : !isEmpty ? (
                        <div className="flex-1 flex items-center justify-center text-gray-500 text-sm p-8 text-center">
                            <div>
                                <p className="mb-2">PDF not available for this paper.</p>
                                {paper && paper.arxiv_id && (
                                    <a href={`https://arxiv.org/pdf/${paper.arxiv_id}`}
                                        target="_blank" rel="noopener noreferrer"
                                        className="text-blue-400 hover:text-blue-300 text-xs">
                                        Open on arXiv directly
                                    </a>
                                )}
                            </div>
                        </div>
                    ) : null}
                </div>
            );
        }

        // ─── Example Queries ─────────────────────────────────────
        const EXAMPLES = [
            "What is the scaled dot-product attention formula?",
            "How does LoRA reduce trainable parameters?",
            "Compare RAG and RLHF approaches to factual accuracy",
            "What is the forward diffusion process in DDPM?",
            "What is the Mamba architecture's selective state space mechanism?",
        ];

        // ─── Main App ────────────────────────────────────────────
        function App() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [stats, setStats] = useState(null);
            const [showStats, setShowStats] = useState(false);
            const [showEval, setShowEval] = useState(false);
            const [evalResults, setEvalResults] = useState(null);
            const [evalRunning, setEvalRunning] = useState(false);
            const [error, setError] = useState(null);
            const [ready, setReady] = useState(false);

            // Paper viewer state
            const [paperViewerData, setPaperViewerData] = useState(null); // { paper, highlightChunkId, highlightText }
            const [paperLoading, setPaperLoading] = useState(false);
            const paperCache = useRef({}); // Cache fetched papers: paperId → paper data

            const endRef = useRef(null);
            const inputRef = useRef(null);

            useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, isLoading]);

            useEffect(() => {
                const check = async () => {
                    try {
                        const res = await fetch(`${API_BASE}/health`);
                        const d = await res.json();
                        setReady(d.pipeline_ready);
                        if (!d.pipeline_ready) setTimeout(check, 2000);
                    } catch { setTimeout(check, 3000); }
                };
                check();
            }, []);

            const handleSubmit = useCallback(async (override) => {
                const q = override || input.trim();
                if (!q || isLoading) return;
                setInput(''); setError(null);

                // Add user message
                setMessages(prev => [...prev, { role: 'user', content: q }]);

                // Add placeholder assistant message that we'll update in real-time
                const assistantIdx = messages.length + 1; // index of the assistant msg we're about to add
                setMessages(prev => [...prev, {
                    role: 'assistant', content: '', streaming: true,
                    data: { sources: [], deflected: false, deflection_reason: '', latency_ms: 0, backend: '', model: '' },
                }]);
                setIsLoading(true);

                let streamedText = '';

                try {
                    await queryRAGStream(q, {
                        onSources: (sources) => {
                            setMessages(prev => {
                                const updated = [...prev];
                                const msg = updated[updated.length - 1];
                                if (msg?.role === 'assistant') {
                                    msg.data = { ...msg.data, sources };
                                }
                                return updated;
                            });
                        },
                        onToken: (token) => {
                            streamedText += token;
                            setMessages(prev => {
                                const updated = [...prev];
                                const msg = updated[updated.length - 1];
                                if (msg?.role === 'assistant') {
                                    msg.content = streamedText;
                                }
                                return [...updated]; // new array ref to trigger re-render
                            });
                        },
                        onDone: (evt) => {
                            setMessages(prev => {
                                const updated = [...prev];
                                const msg = updated[updated.length - 1];
                                if (msg?.role === 'assistant') {
                                    msg.content = evt.answer || streamedText;
                                    msg.streaming = false;
                                    msg.data = {
                                        ...msg.data,
                                        deflected: evt.deflected || false,
                                        deflection_reason: evt.reason || '',
                                        latency_ms: evt.latency_ms || 0,
                                        backend: evt.backend || '',
                                        model: evt.model || '',
                                    };
                                }
                                return [...updated];
                            });
                        },
                        onError: (errMsg) => {
                            setError(errMsg);
                            setMessages(prev => {
                                const updated = [...prev];
                                const msg = updated[updated.length - 1];
                                if (msg?.role === 'assistant') {
                                    msg.content = `Error: ${errMsg}`;
                                    msg.streaming = false;
                                }
                                return [...updated];
                            });
                        },
                    });
                } catch (err) {
                    setError(err.message);
                    setMessages(prev => {
                        const updated = [...prev];
                        const msg = updated[updated.length - 1];
                        if (msg?.role === 'assistant') {
                            msg.content = `Error: ${err.message}`;
                            msg.streaming = false;
                        }
                        return [...updated];
                    });
                } finally {
                    setIsLoading(false);
                    inputRef.current?.focus();
                }
            }, [input, isLoading, messages.length]);

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSubmit(); }
            };

            const handleRunEval = async (runAll) => {
                setEvalRunning(true);
                try { setEvalResults(await runEvalAPI(runAll)); }
                catch (err) { setError(`Eval failed: ${err.message}`); }
                finally { setEvalRunning(false); }
            };

            const handleShowStats = async () => {
                if (!showStats) {
                    try { setStats(await fetchStats()); }
                    catch (err) { setError(`Stats: ${err.message}`); }
                }
                setShowStats(!showStats);
            };

            // Open paper viewer for a source — fetch paper then highlight the chunk
            const handleViewSource = useCallback(async (source) => {
                if (!source.paper_id) return;
                setPaperLoading(true);
                try {
                    let paper = paperCache.current[source.paper_id];
                    if (!paper) {
                        paper = await fetchPaper(source.paper_id);
                        paperCache.current[source.paper_id] = paper;
                    }
                    setPaperViewerData({
                        paper,
                        highlightChunkId: source.chunk_id || '',
                        highlightText: source.text_preview || '',
                    });
                } catch (err) {
                    setError(`Paper: ${err.message}`);
                } finally {
                    setPaperLoading(false);
                }
            }, []);

            const isEmpty = messages.length === 0;

            const hasPaperOpen = !!paperViewerData;

            return (
                <div className="min-h-screen bg-gray-950 text-gray-100 flex flex-col">
                    {/* Header */}
                    <header className="border-b border-gray-800 bg-gray-900/80 backdrop-blur-sm sticky top-0 z-10">
                        <div className="mx-auto px-4 py-3 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                                    <BookIcon size={18} />
                                </div>
                                <div>
                                    <h1 className="text-sm font-bold">RAG-Bench</h1>
                                    <p className="text-xs text-gray-500">AI/ML Research Paper Assistant</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={handleShowStats}
                                    className={`text-xs px-3 py-1.5 rounded-md transition ${showStats ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-400 hover:text-gray-200'}`}>
                                    <span className="inline-flex items-center gap-1"><DatabaseIcon size={12} />Stats</span>
                                </button>
                                <button onClick={() => setShowEval(!showEval)}
                                    className={`text-xs px-3 py-1.5 rounded-md transition ${showEval ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-400 hover:text-gray-200'}`}>
                                    <span className="inline-flex items-center gap-1"><BarChartIcon size={12} />Eval</span>
                                </button>
                                <div className={`w-2 h-2 rounded-full ${ready ? 'bg-green-500' : 'bg-yellow-500 animate-pulse'}`} />
                            </div>
                        </div>
                    </header>

                    {/* Main content row with paper panel */}
                    <div className="flex flex-1 overflow-hidden">
                        {/* Main content area */}
                        <div className="flex-1 flex flex-col overflow-hidden">
                            <main className="flex-1 max-w-4xl w-full mx-auto px-4 py-4 flex flex-col">
                                {showStats && <StatsPanel stats={stats} onClose={() => setShowStats(false)} />}
                                {showEval && <EvalPanel evalResults={evalResults} isRunning={evalRunning} onRun={handleRunEval} onClose={() => setShowEval(false)} />}

                                <div className="flex-1 overflow-y-auto pb-4">
                                    {isEmpty && !isLoading && (
                                        <div className="flex flex-col items-center justify-center h-full min-h-[400px] text-center">
                                            <div className="w-16 h-16 bg-blue-600/10 border border-blue-600/20 rounded-2xl flex items-center justify-center mb-4">
                                                <BookIcon size={28} />
                                            </div>
                                            <h2 className="text-lg font-semibold text-gray-200 mb-1">Ask about AI/ML research</h2>
                                            <p className="text-sm text-gray-500 mb-6 max-w-md">
                                                Grounded answers with citations from {stats?.total_papers || '500+'} research papers.
                                            </p>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-2 max-w-lg w-full">
                                                {EXAMPLES.map((q, i) => (
                                                    <button key={i} onClick={() => handleSubmit(q)} disabled={!ready}
                                                        className="text-left text-xs bg-gray-800/50 hover:bg-gray-800 border border-gray-700/50
                                   hover:border-gray-600 rounded-lg p-3 text-gray-400 hover:text-gray-200
                                   transition disabled:opacity-50 disabled:cursor-not-allowed">
                                                        {q}
                                                    </button>
                                                ))}
                                            </div>
                                            {!ready && (
                                                <p className="text-xs text-yellow-500 mt-4 flex items-center gap-2">
                                                    <Spinner size={12} /> Loading pipeline...
                                                </p>
                                            )}
                                        </div>
                                    )}

                                    {messages.map((msg, i) => <Message key={i} message={msg} onViewSource={handleViewSource} />)}
                                    <div ref={endRef} />
                                </div>

                                {/* Input */}
                                <div className="sticky bottom-0 pt-2 pb-2 bg-gray-950">
                                    {error && (
                                        <div className="text-xs text-red-400 mb-2 flex items-center gap-1">
                                            <AlertIcon size={12} />{error}
                                        </div>
                                    )}
                                    <div className="flex items-end gap-2">
                                        <textarea ref={inputRef} value={input}
                                            onChange={e => setInput(e.target.value)}
                                            onKeyDown={handleKeyDown}
                                            placeholder={ready ? "Ask a question about AI/ML research papers..." : "Pipeline loading..."}
                                            disabled={!ready || isLoading} rows={1}
                                            className="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm
                             text-gray-200 placeholder-gray-500 resize-none focus:outline-none focus:ring-2
                             focus:ring-blue-500/50 focus:border-blue-500/50 disabled:opacity-50"
                                            style={{ minHeight: '48px', maxHeight: '120px' }}
                                            onInput={e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px'; }}
                                        />
                                        <button onClick={() => handleSubmit()}
                                            disabled={!input.trim() || isLoading || !ready}
                                            className="bg-blue-600 hover:bg-blue-500 disabled:bg-gray-700 disabled:text-gray-500
                             text-white p-3 rounded-xl transition flex-shrink-0">
                                            {isLoading ? <Spinner size={18} /> : <SendIcon size={18} />}
                                        </button>
                                    </div>
                                    <p className="text-[10px] text-gray-600 text-center mt-2">
                                        Answers grounded in research papers. Always verify against original sources.
                                    </p>
                                </div>
                            </main>

                            {/* Paper loading indicator */}
                            {paperLoading && (
                                <div className="fixed bottom-6 left-6 bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 flex items-center gap-2 z-50 shadow-lg">
                                    <Spinner size={14} /> <span className="text-xs text-gray-300">Loading paper...</span>
                                </div>
                            )}
                        </div>

                        {/* Paper Viewer — persistent right panel */}
                        <PaperViewer
                            paper={paperViewerData?.paper}
                            highlightChunkId={paperViewerData?.highlightChunkId}
                            highlightText={paperViewerData?.highlightText}
                            onClose={() => setPaperViewerData(null)}
                            isEmpty={!paperViewerData}
                        />
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
