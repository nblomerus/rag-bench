[tool.ruff]
line-length = 122

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]
fixable = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov --cov-config pyproject.toml --cov-report term --cov-report xml:report/cov.xml --cov-branch --junitxml=report/xunit.xml --show-capture=all -vvv -ra"
filterwarnings = [
    "ignore::UserWarning:torch.cuda",
    "ignore:CUDA initialization:UserWarning",
]

[tool.coverage.run]
source = ["rag_bench"]
omit = ["tests/*", "config.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
